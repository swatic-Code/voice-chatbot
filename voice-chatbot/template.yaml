AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless AI voice chatbot (API Gateway, Lambda, OpenRouter, Polly, S3, SNS, CloudFront)

Parameters:
  OpenRouterApiKey:
    Type: String
    NoEcho: true
    Description: OpenRouter API key
  ModelId:
    Type: String
    Default: openai/gpt-4o-mini
    Description: OpenRouter model id
  PollyVoice:
    Type: String
    Default: Joanna
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional email for CloudWatch alarm notifications

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 29
    MemorySize: 256

Resources:
  # ---------- Storage ----------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-audio
            Status: Enabled
            Prefix: audio/
            ExpirationInDays: 1

  # ---------- Static site: private S3 bucket served through CloudFront (HTTPS) ----------
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ---------- Messaging ----------
  NotificationTopic:
    Type: AWS::SNS::Topic

  AlertTopic:
    Type: AWS::SNS::Topic

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ---------- API ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${Distribution.DomainName}'
          - http://localhost:8000
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/chat/
      Handler: app.lambda_handler
      Environment:
        Variables:
          AUDIO_BUCKET: !Ref AudioBucket
          TOPIC_ARN: !Ref NotificationTopic
          OPENROUTER_API_KEY: !Ref OpenRouterApiKey
          MODEL_ID: !Ref ModelId
          POLLY_VOICE: !Ref PollyVoice
      Policies:
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: '*' # Polly does not support resource-level permissions for this action
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub '${AudioBucket.Arn}/audio/*'
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref NotificationTopic
      Events:
        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /chat
            Method: POST

  SubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/subscribe/
      Handler: app.lambda_handler
      Timeout: 10
      Environment:
        Variables:
          TOPIC_ARN: !Ref NotificationTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action: sns:Subscribe
              Resource: !Ref NotificationTopic
      Events:
        Subscribe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /subscribe
            Method: POST

  # ---------- Observability ----------
  ChatLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ChatFunction}'
      RetentionInDays: 14

  SubscribeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SubscribeFunction}'
      RetentionInDays: 14

  ChatErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Chat Lambda reported errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ChatFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  ChatDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Chat Lambda p95 latency is close to the timeout
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ChatFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 20000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  SiteUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref Distribution
